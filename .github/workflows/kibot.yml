name: KiBot automation

on:
  push:
    branches: [ main ]
    paths-ignore: [ "**.md" ]
  pull_request:
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:1.9.1-1_k10.0.4_d13.2
    steps:
      - uses: actions/checkout@v7
      - run: kibot -c config.kibot.yml
      - name: Job summary
        if: always()
        run: python3 .github/scripts/report-summary.py reports >> "$GITHUB_STEP_SUMMARY"
